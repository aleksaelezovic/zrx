name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Linux validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned Zig
        uses: ./.github/actions/setup-zig
        with:
          use-cache: 'true'
          cache-key: library-validation-v2-baseline

      - name: Record library validation environment
        run: |
          uname -sm
          nproc
          grep MemTotal /proc/meminfo
          lscpu
          zig env

      # The build owns the suites, compile-error contracts, examples, the
      # zero-overhead comparison and the cross-target catalog. Only native
      # tests execute; cross builds do not run foreign binaries.
      # Fix CPU selection across heterogeneous hosts; user build defaults stay native.
      - name: Run full validation
        run: zig build check -Dcpu=baseline --summary all

      - name: Run ReleaseFast native tests
        run: zig build test -Doptimize=ReleaseFast -Dcpu=baseline --summary all

  apps:
    name: "App: ${{ matrix.app }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [record-processor]
    defaults:
      run:
        shell: bash
        working-directory: examples/apps/${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned Zig
        uses: ./.github/actions/setup-zig

      - name: Verify app version pin matches the library
        run: cmp .zigversion "$GITHUB_WORKSPACE/.zigversion"

      # Each app is an independent project: use its documented checks,
      # including runs of its real executable.
      - name: Build app
        run: zig build

      - name: Run app tests
        run: zig build test

      - name: Run app ReleaseFast tests
        run: zig build test -Doptimize=ReleaseFast

      - name: Run app checks
        run: zig build check
