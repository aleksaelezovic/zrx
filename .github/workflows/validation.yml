name: Validation

# A pull request into `main` is checked here, merged with `main` as it is;
# `main` requires the branch to be up to date before merging, so what lands
# is what was checked and a push to `main` runs nothing again. Pull requests
# between the branches of a stack are checked once they target `main`.
# A release tag runs this through `release.yml`.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its run; any other run stands alone.
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: "Library: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned Zig
        uses: ./.github/actions/setup-zig
        with:
          use-cache: 'true'
          cache-key: library-validation-v3

      - name: Record environment
        run: |
          uname -sm
          zig env

      # The build owns the suites, compile-error contracts, examples and the
      # zero-overhead comparison. CPU selection is fixed across hosts; user
      # build defaults stay native.
      - name: Run native tests
        run: zig build test -Dcpu=baseline --summary all

      - name: Run ReleaseFast native tests
        run: zig build test -Doptimize=ReleaseFast -Dcpu=baseline --summary all

      # Formatting and the cross-target catalog do not depend on the host.
      # Cross builds do not run foreign binaries.
      - name: Check formatting and cross compilation
        if: runner.os == 'Linux'
        run: zig build fmt cross -Dcpu=baseline --summary all

  apps:
    name: "App: ${{ matrix.app }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        app: [record-processor, audit-archive, file-integrity-manifest, multi-file-log-analyzer, offline-telemetry, nquads-check, http-bench]
    defaults:
      run:
        shell: bash
        working-directory: examples/apps/${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned Zig
        uses: ./.github/actions/setup-zig

      - name: Verify app version pin matches the library
        run: cmp .zigversion "$GITHUB_WORKSPACE/.zigversion"

      # Each app is an independent project: use its documented checks,
      # including runs of its real executable.
      - name: Build app
        run: zig build

      - name: Run app tests
        run: zig build test

      - name: Run app ReleaseFast tests
        run: zig build test -Doptimize=ReleaseFast

      - name: Run app checks
        run: zig build check
